{% include "base.html" %}

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="{% static 'customer/css/profile.css' %}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>{{ profile_info.profile_name|default:user.email_or_phone }} — Profile Settings | PIELAM</title>

<style>

/* ═══════════════════════════════════════════════
       GLOBAL — Design Tokens, Reset, Base
    ═══════════════════════════════════════════════ */
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500&family=Roboto:wght@400;500;700&display=swap');

    :root {
      --r: 12px; 
      --r-sm: 8px;   
      --purple: #7c3aed; 
      --shadow-xs: 0 1px 3px rgba(10,37,64,.05); 

      --ink:        #0f0f0f;
      --ink-2:      #3a3a3a;
      --ink-3:      #6b6b6b;
      --ink-4:      #9b9b9b;
      --surface:    #ffffff;
      --surface-2:  #f5f5f3;
      --surface-3:  #eeede9;
      --border:     #e4e3df;
      --border-2:   #d0cfc9;
      --accent:     #c8102e;
      --accent-2:   #a00d24;
      --gold:       #b8860b;
      --gold-2:     #8b6508;
      --green:      #1a6b3a;
      --green-bg:   #edf7f1;
      --warn:       #92400e;
      --warn-bg:    #fffbeb;
      --blue:       #1e3a8a;
      --blue-light: #3b82f6;
      --primary-dark:    #0a2540;
      --primary-blue:    #0d47a1;
      --primary-light:   #1976d2;
      --accent-gold:     #d4af37;
      --accent-amber:    #ffb300;
      --success-emerald: #00b894;
      --danger-crimson:  #e74c3c;
      --text-primary:    #1a202c;
      --text-secondary:  #4a5568;
      --text-muted:      #718096;
      --bg-primary:      #ffffff;
      --bg-secondary:    #f7fafc;
      --bg-tertiary:     #edf2f7;
      --border-light:    #e2e8f0;
      --border-medium:   #cbd5e0;
      --shadow-xs: 0 1px 3px  rgba(10,37,64,.05);
      --shadow-sm: 0 2px 6px  rgba(10,37,64,.08);
      --shadow-md: 0 4px 12px rgba(10,37,64,.12);
      --shadow-lg: 0 10px 30px rgba(10,37,64,.15);
      --shadow-xl: 0 20px 50px rgba(10,37,64,.2);
      --font-display: 'Cormorant Garamond', serif;
      --font-body:    'Syne', sans-serif;
      --f-mono:       'JetBrains Mono', monospace;
      --f-display:    'Cormorant Garamond', serif;
      --f-body:       'Syne', sans-serif;
      --header-h:          64px;
      --bg:       var(--bg-primary);
      --nav-h:             64px;
      --bottom-bar-height: 68px;
      --r-sm:  8px;
      --r-md:  14px;
      --r-lg:  20px;
      --r-xl:  28px;
      --ease:            cubic-bezier(.4,0,.2,1);
      --ease-out-expo:   cubic-bezier(0.16, 1, 0.3, 1);
      --transition-fast: .15s ease;
      --transition-base: .25s ease;
      --transition-slow: .4s  cubic-bezier(.4,0,.2,1);
      --t-primary:   #0f0f0f;
      --t-secondary: #3a3a3a;
      --t-muted:     #6b6b6b;
      --t-ghost:     #9b9b9b;
      --rim:         #e4e3df;
      --raised:      #f5f5f3;
      --overlay:     #eeede9;
      --abyss:       #0f0f0f;
      --gold-pure:   #b8860b;
      --gold-dim:    rgba(184,134,11,0.40);
      --gold-trace:  rgba(184,134,11,0.08);
      --gold-bright: #d4a017;
      --emerald:  #1a6b3a;
      --amber:    #92400e;
      --ruby:     #c8102e;
      --sapphire: #1e3a8a;

      
    }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior:smooth; font-size:16px; scrollbar-gutter:stable; }
    body {
      font-family: 'roboto';
      background: linear-gradient(135deg, #f7fafc 0%, #edf2f7 100%);
      color: var(--ink);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;  /* ← safe cross-browser fix */

      padding-bottom: var(--bottom-bar-height);
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        radial-gradient(circle at 25% 25%, rgba(13,71,161,0.03) 0%, transparent 50%),
        radial-gradient(circle at 75% 75%, rgba(212,175,55,0.02) 0%, transparent 50%);
      pointer-events: none; 
      z-index: 0;
    }
    a      { text-decoration:none; color:inherit; }
    img    { max-width:100%; display:block; }
    button { font-family:var(--font-body); cursor:pointer; border:none; background:none; }
    ::-webkit-scrollbar       { width:8px; }
    ::-webkit-scrollbar-track { background:var(--surface-3); }
    ::-webkit-scrollbar-thumb { background:var(--border-2); border-radius:8px; border:2px solid var(--surface-3); }
    ::-webkit-scrollbar-thumb:hover { background:var(--ink-4); }
    .hide-mobile { display:none; }
@media (max-width: 768px) { :root { --header-h: 58px; } }
@media (max-width: 480px) { :root { --header-h: 54px; } }
@media (max-width: 360px) { :root { --header-h: 50px; } }
@media (max-width: 320px) { :root { --header-h: 48px; } }

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .navbar-glow{display:none}
  .avatar-glow-ring{animation:none}
  .profile-cover:hover .cover-image{transform:none}
  .profile-avatar-wrap:hover .profile-avatar{transform:none}
}


</style>

</head>

<body>



<!-- Page Header -->
<div class="page-header">
    <div class="page-header-container">
        <div class="header-content">
            <div class="header-icon">
                <i class="fa-solid fa-cog"></i>
            </div>
            <div class="header-text">
                <h1 class="page-title">
                    <span class="title-accent">Profile</span> Settings
                </h1>
                <p class="page-subtitle"> Manage Your Profile and Business </p>
            </div>
        </div>

    </div>
</div>

<!-- ═══════════════════════════════════════════════════════════════
     LOGOUT ACTION BAR
═══════════════════════════════════════════════════════════════ -->
<style>
  .pl-logout-bar {
    display: flex;
    justify-content: flex-end;
    max-width: 1400px;
    margin: 14px auto 0;
    padding: 0 24px;
  }

  .pl-logout-link {
    display: inline-flex;
    align-items: center;
    gap: .55rem;
    padding: .65rem 1.25rem;
    background: #fff;
    border: 1.5px solid rgba(231, 76, 60, .3);
    border-radius: 10px;
    color: #c0392b;
    text-decoration: none;
    font-weight: 700;
    font-size: .88rem;
    box-shadow: 0 2px 6px rgba(10, 37, 64, .06);
    transition: background .2s ease, border-color .2s ease, transform .2s ease, box-shadow .2s ease;
    cursor: pointer;
  }

  .pl-logout-link i {
    font-size: .95rem;
  }

  .pl-logout-link:hover {
    background: #fef2f2;
    border-color: rgba(231, 76, 60, .55);
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(231, 76, 60, .18);
  }

  .pl-logout-link:active {
    transform: translateY(0);
  }

  @media (max-width: 480px) {
    .pl-logout-bar {
      padding: 0 14px;
    }
    .pl-logout-link {
      padding: .55rem 1rem;
      font-size: .82rem;
    }
  }
</style>

<div class="pl-logout-bar">
  <a href="{% url 'customer:logout' %}"
     class="pl-logout-link"
     id="plLogoutBtn"
     role="button"
     aria-label="Log out">
    <i class="fa-solid fa-right-from-bracket"></i>
    <span>Logout</span>
  </a>
</div>

<script>
  (function () {
    const btn = document.getElementById('plLogoutBtn');
    if (!btn) return;

    btn.addEventListener('click', function (e) {
      const confirmed = window.confirm('Are you sure you want to log out?');
      if (!confirmed) {
        e.preventDefault();
      }
    });
  })();
</script>

</body>
</html>
