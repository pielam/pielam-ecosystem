<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign In </title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background: #ffffff;
            padding: 32px;
            width: 360px;
            border-radius: 6px;
            box-shadow: 0 10px 30px rgba(0,0,0,.08);
        }

        h2 {
            margin-bottom: 20px;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 12px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #1e40af;
        }

        .error {
            margin-top: 12px;
            color: #b91c1c;
            font-size: 14px;
            text-align: center;
        }
               .input-wrapper {
    position: relative;
}

#availability-icon {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 16px;
}

.available {
    color: #dc2626; /* green */
}

.unavailable {
    color:  #16a34a; /* red */
}

    </style>
</head>
<body>

<div class="login-box">
    <h2>Sign In</h2>

    <form method="post">
        {% csrf_token %}

        <div class="input-wrapper">
            <input
                type="text"
                id="email_or_phone"
                name="email_or_phone"
                value="{{ email_or_phone|default:'' }}"
                placeholder="Enter email or phone"
                required
            >
            <span id="availability-icon"></span>
        </div>

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            required
        >

        <button type="submit">Sign In</button>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
    </form>

    <div class="signup-link">
        <p>Don't have an account? <a href="{% url 'signup' %}">Sign Up</a></p>
    </div>

</div>


</body>
</html>
